<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Saúde, IA & Racismo Algorítmico</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="logo">🩺 Saúde<span>&</span>IA</a>
            <h2>Acessar o Portal</h2>
            <p>Entre com suas credenciais de paciente, pesquisador ou auditor médico</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); alert('Login efetuado com sucesso!'); window.location.href='index.html';">
            <div class="input-group">
                <label for="loginEmail">E-mail Profissional ou Acadêmico</label>
                <input type="email" id="loginEmail" required placeholder="exemplo@universidade.edu.br">
            </div>

            <div class="input-group">
                <label for="loginPassword">Senha</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Entrar na Plataforma</button>
        </form>

        <p class="auth-switch">Ainda não possui conta? <a href="registro.html">Cadastre-se aqui</a></p>
        <p class="auth-back"><a href="index.html">← Voltar para a Página Inicial</a></p>
    </div>

</body>
</html>
